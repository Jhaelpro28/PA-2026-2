<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - SigoPark</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-body">
    <main clas="login-contenedor">
        <div clas="login-box">
            <img th:src="@{/img/logo.png}" alt="SigoPark" class="login-logo">
            <h1>SigoPark</h1>
            <p class="login-subtitulos">Sistema gestion de parqueo</p>

            <p th:if="${error}" class="login-error" th:text="${error}">Usuario o contraseña son incorrectos</p>

            <form method="post" th:action="@{/login}" clas="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
