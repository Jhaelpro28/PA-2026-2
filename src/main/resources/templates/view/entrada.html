<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de entrada - SigoPark</title>
    <link rel="stylesheet" href="../../static/css/base.css" th:href="@{/css/base.css}">
    <link rel="stylesheet" href="../../static/css/entrada.css" th:href="@{/css/entrada.css}">
</head>
<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main>
        <h1>Registro de entrada</h1>

        <p th:if="${mensaje}" class="mensaje-exito" th:text="${mensaje}">Vehículo registrado correctamente.</p>
        <p th:if="${error}" class="mensaje-error" th:text="${error}">No se pudo registrar la entrada.</p>

        
        <div th:replace="~{fragments/escaner :: escaner('entrada', '#placa')}"></div>


        <form method="post" th:action="@{/entrada}">
            <div class="form-group">
                <label for="placa">Placa</label>
                <input type="text" id="placa" name="placa" placeholder="EJ: ABC123" required>
            </div>
            <div class="form-group">
                <label for="tipoVehiculo">Tipo de vehículo</label>
                <select id="tipoVehiculo" name="tipoVehiculo" required>
                    <option value="">Seleccione un tipo</option>
                    <option value="CARRO">Carro</option>
                    <option value="MOTO">Moto</option>
                    <option value="BICICLETA">Bicicleta</option>
                </select>
            </div>
            <div class="form-group">
                <label for="zonaId">Zona</label>
                <select id="zonaId" name="zonaId" required>
                    <option value="">Seleccione una zona</option>
                    <option th:each="zona : ${zonas}" th:value="${zona.id}" th:text="${zona.nombre}">Zona</option>
                </select>
            </div>
            <button type="submit" class="btn-primario">Registrar entrada</button>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script th:src="@{/js/camara.js}"></script>

</body>
</html>
