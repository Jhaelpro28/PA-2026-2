<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen - SigoPark</title>
    <link rel="stylesheet" href="../../static/css/base.css" th:href="@{/css/base.css}">
    <link rel="stylesheet" href="../../static/css/resumen.css" th:href="@{/css/resumen.css}">
</head>
<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="resumen-contenedor">
        <h1>Resumen</h1>

        <form method="get" th:action="@{/resumen}" class="filtro-form">
            <div class="form-group">
                <label for="desde">Desde</label>
                <input type="date" id="desde" name="desde" th:value="${desde}">
            </div>
            <div class="form-group">
                <label for="hasta">Hasta</label>
                <input type="date" id="hasta" name="hasta" th:value="${hasta}">
            </div>
            <button type="submit" class="btn-secundario">Filtrar</button>
        </form>

        <section class="resumen-cards">
            <div class="card card-total">
                <span class="card-numero" th:text="${totalVehiculos}">0</span>
                <span class="card-label">Vehículos atendidos</span>
            </div>
            <div class="card card-ocupados">
                <span class="card-numero" th:text="'$' + ${#numbers.formatInteger(totalRecaudo, 1, 'POINT')}">$0</span>
                <span class="card-label">Recaudo total</span>
            </div>
            <div class="card card-disponibles">
                <span class="card-numero" th:text="${promedioEstancia}">0h 0m</span>
                <span class="card-label">Promedio de estancia</span>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
