<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - SigoPark</title>
    <link rel="stylesheet" href="../../static/css/base.css" th:href="@{/css/base.css}">
    <link rel="stylesheet" href="../../static/css/login.css" th:href="@{/css/login.css}">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="login-box">
            <h1>SigoPark</h1>
            <p class="login-subtitle">Sistema de gestión de parqueadero</p>

            <p th:if="${error}" class="login-error" th:text="${error}">Usuario o contraseña incorrectos</p>

            <form method="post" th:action="@{/login}" class="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
